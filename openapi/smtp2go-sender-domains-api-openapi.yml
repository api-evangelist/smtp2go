                                rpath_status:
                                  type: string
                                  example: ''
                                rpath_verified:
                                  type: boolean
                                  example: true
                                  default: true
                                rpath_value:
                                  type: string
                                  example: return.smtp2go.net
                                dkim_status:
                                  type: string
                                  example: ''
                                dkim_verified:
