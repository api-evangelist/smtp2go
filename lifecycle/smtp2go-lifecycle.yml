deprecation:
  policy_url: https://developers.smtp2go.com/reference/changelog
  sunset_header: false
  deprecation_header: false
  practice: >-
    Deprecations are announced in the dated changelog and marked in the endpoint
    description in the API reference, in prose. SMTP2GO does not publish a
    formal deprecation window, and the API does not emit RFC 8594 Sunset or
    Deprecation response headers — an agent cannot detect a deprecation at
    runtime, only by reading the docs.
  observed:
    - item: GET/POST /email/view ("View and search sent emails")
      status: deprecated
      replacement: /activity/search
      evidence: >-
        Reference description states "This endpoint is deprecated and will not
        be accessible in future API versions. Please use the Activity Search
        endpoint instead." It is still listed in the docs index but is no longer
        present in the endpoint set the provider's own MCP server enumerates.
      source: https://developers.smtp2go.com/reference/view-sent-emails
    - item: stats fields spam_rejects and bounce_rejects
      status: deprecated
      replacement: rejects
      date: '2025-06-12'
      evidence: 'Changelog: "Marked spam_rejects and bounce_rejects as deprecated (these fields will continue to be returned however); Added a rejects property".'
      source: https://developers.smtp2go.com/reference/changelog
    - item: feedback_domain on /users/smtp/*
      status: removed
      date: '2025-04-03'
      evidence: 'Changelog: "Removed feedback_domain from the /users/smtp* endpoints as it''s no longer required."'
      source: https://developers.smtp2go.com/reference/changelog
