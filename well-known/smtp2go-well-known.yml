observations:
  - >-
    The SMTP2GO remote MCP server at https://developers.smtp2go.com/mcp does not
    advertise OAuth: /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both 404 on that host. The server
    authenticates API execution with the same X-Smtp2go-Api-Key header the REST
    API uses, so there is no OAuth metadata document to harvest.
  - >-
    Both /llms.txt files that SMTP2GO does publish are served from the site root,
    not /.well-known/ — see llms/.
