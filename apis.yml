name: SMTP2GO
description: >-
  SMTP2GO is a New Zealand-founded email and SMS delivery platform, running since
  2006, that sends and tracks transactional and marketing messages over SMTP relay
  or a JSON REST API from data centres in the United States, the European Union and
  Australia. The v3 API covers sending standard, MIME, batch and scheduled email,
  sending and receiving SMS, verifying sender domains and single sender addresses,
  managing SMTP users, API keys, IP allow lists and IP authentication, templates,
  webhooks, suppressions, subaccounts, dedicated IPs and the email archive, plus
  activity search and delivery statistics. It also ships a remote MCP server and a
  published Agent Skill for AI agents.
